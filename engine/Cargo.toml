[package]
name = "secureledger-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Foundation", "Win32_Security"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
